<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0F1117"/>
  <!-- Microphone body -->
  <rect x="24" y="10" width="16" height="28" rx="8" fill="#6C63FF"/>
  <!-- Microphone stand arc -->
  <path d="M18 36 Q18 52 32 52 Q46 52 46 36" stroke="#6C63FF" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <!-- Stand vertical -->
  <line x1="32" y1="52" x2="32" y2="58" stroke="#6C63FF" stroke-width="3.5"
        stroke-linecap="round"/>
  <!-- Stand base -->
  <line x1="22" y1="58" x2="42" y2="58" stroke="#6C63FF" stroke-width="3.5"
        stroke-linecap="round"/>
  <!-- Sound wave left -->
  <path d="M14 30 Q11 32 14 34" stroke="#EAEAEA" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.7"/>
  <!-- Sound wave right -->
  <path d="M50 30 Q53 32 50 34" stroke="#EAEAEA" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.7"/>
</svg>
